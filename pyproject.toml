[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripmoney"
version = "0.2.0"
description = "Trip Money & Container Tracking (SPEC-LOG-2026)"
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0", "pyyaml>=6.0", "xlsxwriter>=3.1"]

[project.optional-dependencies]
ocr = ["pymupdf>=1.24", "rapidocr-onnxruntime>=1.3", "numpy"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "openpyxl>=3.1", "httpx>=0.27"]
all = ["tripmoney[ocr,web,dev]"]

[project.scripts]
tripmoney = "tripmoney.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tripmoney = ["defaults/*.yaml", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
